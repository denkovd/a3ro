# ──────────────────────────────────────────────────────────────
# Australia Watch — OECD series (roadmap #78).
# sdmx.oecd.org refuses Vercel's servers (HTTP 500), so the OECD
# leading indicator and consumer/business confidence are fetched
# here instead of in the Vercel australia-watch cron (02:15 UTC).
# Monthly data: one run a day is plenty.
#
# Required repo secret: DATABASE_URL (pooled Supabase string).
# ──────────────────────────────────────────────────────────────
name: oecd-refresh

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: oecd-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GHA runners often pick the unreachable Supabase AAAA first.
      NODE_OPTIONS: --dns-result-order=ipv4first
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Diagnose OECD
        run: |
          U='https://sdmx.oecd.org/public/rest/data/OECD.SDD.STES,DSD_STES@DF_CLI,/AUS.M.LI.IX._Z.AA.IX._Z.H?startPeriod=2012-01&format=csvfilewithlabels'
          for ua in "node" "A3RO-Intelligence/1.0 (+https://a3ro.com.au)" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"; do
            code=$(curl -s -o /tmp/o.txt -w '%{http_code}' -A "$ua" "$U"); echo "UA=[$ua] -> $code $(head -c 100 /tmp/o.txt)"; sleep 5
          done
          code=$(curl -s -o /tmp/o.txt -w '%{http_code}' "$U"); echo "curl default UA -> $code"; sleep 5
          node -e "fetch(process.argv[1]).then(async r=>console.log('node fetch ->',r.status,(await r.text()).slice(0,100)))" "$U"; sleep 5
          node -e "fetch(process.argv[1],{headers:{'User-Agent':'A3RO-Intelligence/1.0 (+https://a3ro.com.au)'}}).then(async r=>console.log('node fetch + UA ->',r.status))" "$U"
        working-directory: .
      - run: npm ci
      - name: Fetch OECD series
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/run-australia-oecd.ts

# ──────────────────────────────────────────────────────────────
# Australia Watch — OECD series (roadmap #78).
# sdmx.oecd.org answers a bare HTTP 500 to requests that come too
# close together, so the OECD leading indicator and consumer/business
# confidence are fetched here, a minute apart with long retry waits,
# instead of in the Vercel australia-watch cron (02:15 UTC).
# Monthly data: one run a day is plenty.
# Also fetches APRA mortgage stress (#89) and AEMO power prices (#90);
# run by hand with aemo_months (e.g. 72) to backfill power prices.
#
# Required repo secret: DATABASE_URL (pooled Supabase string).
# ──────────────────────────────────────────────────────────────
name: oecd-refresh

on:
  schedule:
    - cron: "0 3 * * *"
    # A second try each day: OECD's throttling comes and goes, and the data is monthly.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      aemo_months:
        description: "AEMO months to fetch (default 3; 72 to backfill)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: oecd-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # GHA runners often pick the unreachable Supabase AAAA first.
      NODE_OPTIONS: --dns-result-order=ipv4first
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Fetch OECD, APRA and AEMO series
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AEMO_MONTHS: ${{ inputs.aemo_months }}
        run: npx tsx scripts/run-australia-oecd.ts

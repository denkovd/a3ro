# Temporary (27 Nov): print the shape of DefiLlama's fees, revenue and
# protocol lists for roadmap #124. Delete after use.
name: probe-defillama
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Probe
        run: |
          cat > probe.mjs <<'JS'
          const j = async (u) => { const r = await fetch(u); console.log("GET", u, r.status); return r.ok ? r.json() : null; };
          const show = (label, o) => console.log(label, JSON.stringify(o).slice(0, 1500));
          const fees = await j("https://api.llama.fi/overview/fees?excludeTotalDataChart=true&excludeTotalDataChartBreakdown=true&dataType=dailyFees");
          if (fees) { console.log("fees keys", Object.keys(fees)); const ps = fees.protocols; console.log("n", ps.length); show("fees[0]", ps[0]);
            for (const n of ["pump", "hyperliquid", "tether", "uniswap", "aave", "jupiter", "raydium", "circle"]) show("fees~" + n, ps.filter((p) => (p.name + p.slug).toLowerCase().includes(n)).slice(0, 4).map((p) => ({ name: p.name, slug: p.slug, id: p.defillamaId, parent: p.parentProtocol, type: p.protocolType, cat: p.category, t30: p.total30d })));
            const top = [...ps].sort((a, b) => (b.total30d ?? 0) - (a.total30d ?? 0)).slice(0, 40).map((p) => [p.name, p.parentProtocol ?? "", p.protocolType, p.category, Math.round((p.total30d ?? 0) / 1e6)]);
            show("top40 fees 30d $M", top); }
          const rev = await j("https://api.llama.fi/overview/fees?excludeTotalDataChart=true&excludeTotalDataChartBreakdown=true&dataType=dailyRevenue");
          if (rev) show("rev top", [...rev.protocols].sort((a, b) => (b.total30d ?? 0) - (a.total30d ?? 0)).slice(0, 25).map((p) => [p.name, p.parentProtocol ?? "", Math.round((p.total30d ?? 0) / 1e6)]));
          const hrev = await j("https://api.llama.fi/overview/fees?excludeTotalDataChart=true&excludeTotalDataChartBreakdown=true&dataType=dailyHoldersRevenue");
          if (hrev) show("holders rev top", [...hrev.protocols].sort((a, b) => (b.total30d ?? 0) - (a.total30d ?? 0)).slice(0, 25).map((p) => [p.name, p.parentProtocol ?? "", Math.round((p.total30d ?? 0) / 1e6)]));
          const lite = await j("https://api.llama.fi/lite/protocols2?b=2");
          if (lite) { console.log("lite keys", Object.keys(lite)); show("lite.protocols[0]", lite.protocols?.[0]); show("lite.parent[0]", lite.parentProtocols?.[0]);
            show("lite parents pump/uniswap/hyperliquid", (lite.parentProtocols ?? []).filter((p) => /pump|uniswap|hyperliquid|jupiter/i.test(p.name)).map((p) => ({ id: p.id, name: p.name, gecko: p.gecko_id, mcap: p.mcap }))); }
          const prot = await j("https://api.llama.fi/protocols");
          if (prot) { show("protocols[0] keys", Object.keys(prot[0])); show("protocols pump", prot.filter((p) => /pump/i.test(p.name)).map((p) => ({ id: p.id, name: p.name, gecko: p.gecko_id, mcap: p.mcap, parent: p.parentProtocol, cat: p.category })));
            const cex = prot.filter((p) => p.category === "CEX").sort((a, b) => (b.tvl ?? 0) - (a.tvl ?? 0)).slice(0, 15).map((p) => [p.name, Math.round((p.tvl ?? 0) / 1e9), p.change_7d]); show("cex top tvl $bn", cex);
            console.log("protocols with mcap", prot.filter((p) => p.mcap > 0).length); }
          JS
          node probe.mjs

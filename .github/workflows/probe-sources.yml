# Temporary (28 Nov): inspect APRA, AEMO and ASIC files and check the GDP per capita card (#88-#91). Delete after use.
name: probe-sources
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Probe
        run: |
          npm i --silent https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz >/dev/null 2>&1
          cat > probe.mjs <<'JS'
          import * as XLSX from "xlsx";
          const UA = { "User-Agent": "Mozilla/5.0 (A3RO-Intelligence probe)" };
          const get = async (u) => { const r = await fetch(u, { headers: UA }); console.log("GET", u, r.status, r.headers.get("content-type")); return r; };
          const UA2 = UA;
          try { const r = await get("https://a3ro.com.au/api/australia-watch/latest"); const j = await r.json(); const s = JSON.stringify(j); const all = [...s.matchAll(/"indicator":"gdp_per_capita"[^}]*"referencePeriod":"([^"]+)"/g)].map((m) => m[1]); console.log("gdp periods", all.slice(-4)); } catch (e) { console.log("site err", e.message); }
          const url = "https://www.apra.gov.au/system/files/2026-09/Quarterly%20authorised%20deposit-taking%20institution%20property%20exposures%20statistics%20June%202026.xlsx";
          const wb = XLSX.read(await (await get(url)).arrayBuffer());
          const a = XLSX.utils.sheet_to_json(wb.Sheets["Tab 1b"], { header: 1, raw: true, defval: null });
          a.forEach((r, i) => { if (r[0] || i < 5) console.log(i, JSON.stringify([r[0], r[1], r[2], r[3], r[r.length - 2], r[r.length - 1]]).slice(0, 300)); });
          console.log("cols", a[3]?.length);
          for (const m of ["202101", "201901", "201001"]) { const r = await fetch(`https://aemo.com.au/aemo/data/nem/priceanddemand/PRICE_AND_DEMAND_${m}_VIC1.csv`, { headers: UA }); console.log("AEMO", m, r.status); }
          JS
          node probe.mjs

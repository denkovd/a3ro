name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      # Production dependencies only (2026-11-18). GHSA-fc5q-39xc-vjpf (picomatch ReDoS, no patched
      # release) reaches us only via Tailwind v3 build tooling, a devDependency. Restore the full
      # `npm audit` once picomatch ships a fix or after migrating to Tailwind v4.
      - run: npm audit --omit=dev
      - run: npm --prefix backend audit
      - run: npm run test:security

# Temporary (28 Nov): inspect ASIC Series 1 workbook (#91). Delete after use.
name: probe-asic
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Probe
        run: |
          npm i --silent https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz >/dev/null 2>&1
          cat > probe.mjs <<'JS'
          import * as XLSX from "xlsx";
          const UA = { "User-Agent": "Mozilla/5.0 (A3RO-Intelligence probe)" };
          const h = await (await fetch("https://asic.gov.au/regulatory-resources/find-a-document/statistics/insolvency-statistics/insolvency-statistics-series-1-companies-entering-external-administration/", { headers: UA })).text();
          const url = [...h.matchAll(/href="([^"]+series-1-and-series-2[^"]+\.xlsx)"/gi)].map((m) => m[1])[0];
          console.log("URL", url);
          const wb = XLSX.read(await (await fetch(url, { headers: UA })).arrayBuffer());
          for (const n of ["1", "1.1", "1.2", "1.4.1", "1.4.2", "1.4.3", "Data set"]) {
            const a = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null });
            console.log(`=== ${n} rows ${a.length}`);
            a.slice(0, 14).forEach((r, i) => console.log(i, JSON.stringify(r.slice(0, 14)).slice(0, 500)));
            console.log("last", JSON.stringify(a[a.length - 1]?.slice(0, 14)).slice(0, 400), JSON.stringify(a[a.length - 2]?.slice(0, 14)).slice(0, 400));
          }
          JS
          node probe.mjs
